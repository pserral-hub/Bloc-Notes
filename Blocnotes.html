<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="notes">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230d0d0f'/%3E%3Ctext x='90' y='118' font-family='system-ui,sans-serif' font-size='80' font-weight='300' fill='%23e8a87c' text-anchor='middle'%3En%3C/text%3E%3C/svg%3E">
<link rel="manifest" href='data:application/manifest+json,{"name":"notes","short_name":"notes","start_url":".","display":"standalone","background_color":"#0d0d0f","theme_color":"#0d0d0f"}'>
<title>notes</title>
<style>
:root{
  --bg:#0d0d0f;
  --surface:#16161a;
  --surface-2:#1c1c22;
  --border:#2a2a32;
  --text:#e4e4e7;
  --text-2:#a1a1aa;
  --text-3:#71717a;
  --accent:#e8a87c;
  --accent-dim:#e8a87c22;
  --danger:#f87171;
  --radius:10px;
  --ease:cubic-bezier(.4,0,.2,1);
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#fafafa;--surface:#fff;--surface-2:#f4f4f5;
    --border:#e4e4e7;--text:#18181b;--text-2:#52525b;--text-3:#a1a1aa;
    --accent:#c27a3a;--accent-dim:#c27a3a15;--danger:#dc2626;
  }
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
.view{
  max-width:560px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 32px) 20px calc(env(safe-area-inset-bottom) + 32px);
  opacity:0;transform:translateY(6px);
  transition:opacity .25s var(--ease),transform .25s var(--ease);
}
.view.active{opacity:1;transform:translateY(0)}
.hidden{display:none}

/* ── auth ── */
.auth{text-align:center;padding-top:20vh}
.auth .logo{
  font-size:13px;font-weight:500;letter-spacing:.08em;
  color:var(--text-3);text-transform:uppercase;margin-bottom:32px;
}
.auth h1{font-size:22px;font-weight:600;margin-bottom:6px;letter-spacing:-.01em}
.auth .sub{color:var(--text-3);font-size:14px;margin-bottom:32px}
.auth form{text-align:left}
.auth input{
  width:100%;padding:12px 14px;margin-bottom:10px;
  border:1px solid var(--border);border-radius:var(--radius);
  font-size:15px;background:var(--surface);color:var(--text);
  outline:none;transition:border-color .2s;
}
.auth input:focus{border-color:var(--accent)}
.auth input::placeholder{color:var(--text-3)}
.auth button{
  width:100%;padding:12px;margin-top:4px;
  border:none;border-radius:var(--radius);
  background:var(--accent);color:var(--bg);
  font-size:15px;font-weight:600;cursor:pointer;
  transition:opacity .15s;
}
.auth button:active{opacity:.8}
.auth .swap{margin-top:20px;font-size:13px;color:var(--text-3)}
.auth .swap a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:500}
.err{color:var(--danger);font-size:13px;margin-bottom:10px;min-height:18px;transition:opacity .2s}

/* ── header ── */
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.hdr h1{font-size:18px;font-weight:600;letter-spacing:-.01em}
.hdr .out{
  font-size:12px;color:var(--text-3);background:none;
  border:1px solid var(--border);padding:5px 12px;
  border-radius:6px;cursor:pointer;transition:color .15s,border-color .15s;
}
.hdr .out:hover{color:var(--text-2);border-color:var(--text-3)}

/* ── search ── */
.search{
  width:100%;padding:10px 14px;margin-bottom:16px;
  border:1px solid var(--border);border-radius:var(--radius);
  font-size:14px;background:var(--surface);color:var(--text);
  outline:none;transition:border-color .2s;
}
.search:focus{border-color:var(--accent)}
.search::placeholder{color:var(--text-3)}

/* ── add ── */
.add{
  width:100%;padding:11px;margin-bottom:20px;
  border:1px solid var(--border);border-radius:var(--radius);
  background:var(--surface);color:var(--text-2);
  font-size:14px;font-weight:500;cursor:pointer;
  transition:border-color .15s,color .15s;
}
.add:hover{border-color:var(--accent);color:var(--accent)}

/* ── cards ── */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 16px;
  margin-bottom:6px;cursor:pointer;
  transition:border-color .15s,background .15s;
}
.card:hover{border-color:var(--text-3);background:var(--surface-2)}
.card h3{font-size:14px;font-weight:600;margin-bottom:3px;letter-spacing:-.01em}
.card .p{font-size:13px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.card .m{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.card .m span{font-size:11px;color:var(--text-3)}
.card .m button{
  background:none;border:none;color:var(--text-3);
  font-size:12px;cursor:pointer;opacity:0;
  transition:opacity .15s,color .15s;
}
.card:hover .m button{opacity:1}
.card .m button:hover{color:var(--danger)}
.empty{text-align:center;color:var(--text-3);padding:64px 0;font-size:14px}

/* ── editor ── */
.ed{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px;
}
.ed input{
  width:100%;padding:8px 0;margin-bottom:14px;
  border:none;border-bottom:1px solid var(--border);
  font-size:17px;font-weight:600;outline:none;
  background:transparent;color:var(--text);
  transition:border-color .2s;
}
.ed input:focus{border-color:var(--accent)}
.ed input::placeholder{color:var(--text-3)}
.ed textarea{
  width:100%;min-height:280px;padding:8px 0;
  border:none;outline:none;resize:vertical;
  font-size:14px;line-height:1.7;
  background:transparent;color:var(--text);
  font-family:inherit;
}
.ed textarea::placeholder{color:var(--text-3)}
.ed .meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:11px;color:var(--text-3)}
.ed .row{display:flex;gap:8px;margin-top:16px}
.ed .row button{
  flex:1;padding:11px;border:none;border-radius:var(--radius);
  font-size:13px;font-weight:600;cursor:pointer;
  transition:opacity .15s;
}
.ed .row .s{background:var(--accent);color:var(--bg)}
.ed .row .c{background:var(--surface-2);color:var(--text-2)}
.ed .row button:active{opacity:.8}

/* ── toast ── */
.toast{
  position:fixed;bottom:calc(env(safe-area-inset-bottom) + 24px);
  left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:8px;padding:10px 18px;
  font-size:13px;color:var(--text-2);
  opacity:0;pointer-events:none;
  transition:opacity .2s var(--ease),transform .2s var(--ease);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── save indicator ── */
.save-ind{
  font-size:11px;color:var(--text-3);
  opacity:0;transition:opacity .3s;
}
.save-ind.show{opacity:1}

@media(prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="view" id="v-auth">
  <div class="auth">
    <p class="logo">notes</p>
    <h1 id="auth-title">Inicia sessio</h1>
    <p class="sub">Les teves notes, xifrades i privades</p>
    <p class="err" id="err"></p>
    <form id="f">
      <input type="text" id="u" placeholder="Usuari" autocomplete="off" required>
      <input type="password" id="p" placeholder="Contrasenya" required>
      <button type="submit" id="btn">Entrar</button>
    </form>
    <p class="swap"><span id="st">No tens compte?</span> <a id="sa">Registra't</a></p>
  </div>
</div>

<div class="view hidden" id="v-list">
  <div class="hdr">
    <h1>notes</h1>
    <button class="out" onclick="out()">sortir</button>
  </div>
  <input type="text" class="search" id="srch" placeholder="Cerca notes..." autocomplete="off">
  <button class="add" onclick="newNote()">+ nova nota</button>
  <div id="lst"></div>
</div>

<div class="view hidden" id="v-edit">
  <div class="hdr">
    <h1>editar</h1>
    <span class="save-ind" id="sind">desat</span>
  </div>
  <div class="ed">
    <input type="text" id="et" placeholder="Titol">
    <textarea id="eb" placeholder="Escriu aqui..."></textarea>
    <div class="meta">
      <span id="wc">0 paraules</span>
      <span id="sc"></span>
    </div>
    <div class="row">
      <button class="s" onclick="save()">Desar</button>
      <button class="c" onclick="back()">Cancel·lar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let isReg=false,key=null,uid=null,notes=[],eid=null,query='';

// crypto
async function dk(pw,saltHex){
  const s=new Uint8Array(hex2b(saltHex));
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:100000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function enc(t,k){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(t));
  return{c:b64(new Uint8Array(c)),i:b64(iv)};
}
async function dec(c,i,k){
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(i)},k,u8(c)));
}
function hex2b(h){const a=new Uint8Array(h.length/2);for(let i=0;i<h.length;i+=2)a[i/2]=parseInt(h.substr(i,2),16);return a}
function b64(b){let s='';b.forEach(x=>s+=String.fromCharCode(x));return btoa(s)}
function u8(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function rnd(){return b64(crypto.getRandomValues(new Uint8Array(16)))}
async function hash(pw,salt){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw+salt));
  return b64(new Uint8Array(buf));
}

// storage
function getUsers(){return JSON.parse(localStorage.getItem('users')||'{}')}
function setUsers(u){localStorage.setItem('users',JSON.stringify(u))}
function getNotes(){return JSON.parse(localStorage.getItem('notes')||'[]')}
function setNotes(n){localStorage.setItem('notes',JSON.stringify(n))}

// toast
let toastTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2000);
}

// views
function show(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v=>{
    if(v.id===id){v.classList.remove('hidden');requestAnimationFrame(()=>v.classList.add('active'))}
    else{v.classList.add('hidden')}
  });
  if(id==='v-list')loadNotes();
}

// auth
document.getElementById('sa').onclick=()=>{
  isReg=!isReg;
  document.getElementById('auth-title').textContent=isReg?"Crea un compte":'Inicia sessio';
  document.getElementById('btn').textContent=isReg?"Registra't":'Entrar';
  document.getElementById('st').textContent=isReg?'Ja tens compte?':'No tens compte?';
  document.getElementById('sa').textContent=isReg?'Inicia sessio':"Registra't";
  document.getElementById('err').textContent='';
};

document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();
  const u=document.getElementById('u').value.trim();
  const p=document.getElementById('p').value;
  if(!u||!p)return;
  const users=getUsers();
  try{
    if(isReg){
      if(users[u])throw 'Aquest usuari ja existeix';
      if(p.length<4)throw 'Contrasenya massa curta (min. 4)';
      const salt=rnd();
      users[u]={h:await hash(p,salt),s:salt};
      setUsers(users);
      key=await dk(p,salt);uid=u;
      show('v-list');
    }else{
      if(!users[u])throw 'Usuari no trobat';
      const h=await hash(p,users[u].s);
      if(h!==users[u].h)throw 'Contrasenya incorrecta';
      key=await dk(p,users[u].s);uid=u;
      show('v-list');
    }
  }catch(err){document.getElementById('err').textContent=err}
};

function out(){key=null;uid=null;notes=[];show('v-auth')}

// notes
async function loadNotes(){
  notes=getNotes().filter(n=>n.u===uid);
  render();
}

async function render(){
  const el=document.getElementById('lst');
  const filtered=query?notes.filter(n=>n.t.toLowerCase().includes(query)):notes;
  if(!filtered.length){el.innerHTML='<p class="empty">Cap nota</p>';return}
  el.innerHTML='';
  for(const n of filtered){
    let prev='';
    try{prev=(await dec(n.c,n.i,key)).slice(0,90)}catch{prev=''}
    const d=document.createElement('div');
    d.className='card';
    d.innerHTML=`<h3>${esc(n.t)}</h3><p class="p">${esc(prev)}</p><div class="m"><span>${fmt(n.d)}</span><button onclick="del(${n.id})">esborrar</button></div>`;
    d.onclick=e=>{if(e.target.tagName!=='BUTTON')openEdit(n.id)};
    el.appendChild(d);
  }
}

function newNote(){eid=null;document.getElementById('et').value='';document.getElementById('eb').value='';show('v-edit');document.getElementById('et').focus()}
async function openEdit(id){
  const n=notes.find(x=>x.id===id);if(!n)return;
  eid=id;
  document.getElementById('et').value=n.t;
  try{document.getElementById('eb').value=await dec(n.c,n.i,key)}catch{document.getElementById('eb').value=''}
  show('v-edit');
  updateCount();
}

async function save(){
  const t=document.getElementById('et').value.trim();
  const b=document.getElementById('eb').value;
  if(!t){toast('Posa un titol');return}
  const{c,i}=await enc(b,key);
  const all=getNotes();
  if(eid){
    const idx=all.findIndex(x=>x.id===eid);
    if(idx>-1)all[idx]={...all[idx],t,c,i,d:Date.now()};
  }else{
    all.unshift({id:Date.now(),u:uid,t,c,i,d:Date.now()});
  }
  setNotes(all);
  toast('Desat');
  back();
}

function del(id){
  setNotes(getNotes().filter(x=>x.id!==id));
  toast('Esborrat');
  loadNotes();
}

function back(){show('v-list')}

// search
document.getElementById('srch').oninput=e=>{query=e.target.value.toLowerCase();render()}

// word count
document.getElementById('eb').oninput=updateCount;
function updateCount(){
  const txt=document.getElementById('eb').value;
  const words=txt.trim()?txt.trim().split(/\s+/).length:0;
  document.getElementById('wc').textContent=words+' paraules';
  document.getElementById('sc').textContent=txt.length+' caracters';
}

// keyboard shortcuts
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();document.getElementById('srch').focus()}
  if((e.metaKey||e.ctrlKey)&&e.key==='n'&&document.getElementById('v-list').classList.contains('active')){e.preventDefault();newNote()}
  if(e.key==='Escape'){
    if(!document.getElementById('v-edit').classList.contains('hidden'))back();
  }
});

// utils
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function fmt(ts){
  const d=new Date(ts);
  const now=new Date();
  if(d.toDateString()===now.toDateString())return d.toLocaleTimeString('ca',{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString('ca',{day:'numeric',month:'short'});
}

// init
show('v-auth');
</script>
</body>
</html>
